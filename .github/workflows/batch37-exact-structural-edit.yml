name: Batch 37 Exact Structural Edit

on:
  push:
    branches:
      - v31.25-classic-contracts-batch37-blocks-view-presentation-boundary

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v31.25-classic-contracts-batch37-blocks-view-presentation-boundary
          fetch-depth: 0
      - name: Apply exact one-line edit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('structural-runtime.js')
          s=p.read_text(encoding='utf-8')
          old="    case 'blocks': return blocks();"
          new="    case 'blocks': return globalThis.TradingResearchBlocksViewPresentationContract.render();"
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one old Blocks route, found {s.count(old)}')
          if new in s:
              raise SystemExit('New Blocks route already present before edit')
          out=s.replace(old,new,1)
          if out.count(new) != 1 or old in out:
              raise SystemExit('Exact replacement postcondition failed')
          p.write_text(out,encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --numstat -- structural-runtime.js | awk '{print $1+$2}')" = "2"
      - name: Commit exact edit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add structural-runtime.js
          git commit -m 'refactor: bind Batch 37 Blocks route contract'
          git push origin HEAD:v31.25-classic-contracts-batch37-blocks-view-presentation-boundary
