name: Batch 38 Install RED Gate

on:
  push:
    branches:
      - v31.25-classic-contracts-batch38-current-view-router-read-boundary

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v31.25-classic-contracts-batch38-current-view-router-read-boundary
          fetch-depth: 0
      - name: Chain Batch 38 verifier exactly once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('verify-blocks-view-presentation-boundary.mjs')
          s=p.read_text(encoding='utf-8')
          line="await import('./verify-current-view-router-read-boundary.mjs');"
          if line in s:
              raise SystemExit('Batch 38 verifier already chained before installer')
          if not s.endswith('\n'):
              raise SystemExit('Expected newline-terminated verifier')
          p.write_text(s+line+'\n',encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --numstat -- verify-blocks-view-presentation-boundary.mjs | awk '{print $1+$2}')" = "1"
      - name: Commit RED gate chain
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verify-blocks-view-presentation-boundary.mjs
          git commit -m 'test: chain Batch 38 current view router verifier'
          git push origin HEAD:v31.25-classic-contracts-batch38-current-view-router-read-boundary
