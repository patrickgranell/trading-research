name: Batch 40 Current View Audit

on:
  push:
    branches:
      - v31.25-classic-contracts-batch40-audit-current-view-readers

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v31.25-classic-contracts-batch40-audit-current-view-readers
          fetch-depth: 1
      - name: Inventory executable currentView references
        shell: bash
        run: |
          set -euo pipefail
          files=(
            style-attr-runtime.js
            reports-purity-runtime.js
            structural-runtime.js
            state-runtime.js
            persistence-coalescing-runtime.js
            backup-v2-runtime.js
            security-runtime.js
            event-runtime.js
            cloud-v10-runtime.js
            exit-lab-runtime.js
            canonical-metrics-runtime.js
            csp-runtime.js
            style-runtime.js
            operation-cleanup-runtime.js
            blob-lifecycle-runtime.js
            render-closure-runtime.js
          )
          echo '=== currentView raw occurrences ==='
          for f in "${files[@]}"; do
            if grep -n -E '\bcurrentView\b' "$f" >/tmp/matches 2>/dev/null; then
              echo "--- $f ---"
              cat /tmp/matches
            fi
          done
          echo '=== end ==='
