name: Batch 40 Exact Implementation

on:
  push:
    branches:
      - v31.25-classic-contracts-batch40-navigation-active-view-read-boundary

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v31.25-classic-contracts-batch40-navigation-active-view-read-boundary
          fetch-depth: 0
      - name: Apply exact Batch 40 edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('structural-runtime.js')
          s=p.read_text(encoding='utf-8')
          replacements=[
            ("groupForView(currentView)","groupForView(globalThis.TradingResearchCurrentViewReadContract.current())",1),
            ("setLastView(currentView)","setLastView(globalThis.TradingResearchCurrentViewReadContract.current())",1),
            ("btn.dataset.view===currentView","btn.dataset.view===globalThis.TradingResearchCurrentViewReadContract.current()",2),
          ]
          for old,new,count in replacements:
            actual=s.count(old)
            if actual!=count:
              raise SystemExit(f'Expected {count} occurrences of {old!r}, found {actual}')
            if new in s:
              raise SystemExit(f'New binding already present before replacement: {new!r}')
            s=s.replace(old,new,count)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --numstat -- structural-runtime.js | awk '{print $1+$2}')" = "8"
      - name: Commit exact implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add structural-runtime.js
          git commit -m 'refactor: bind Batch 40 navigation active currentView reads'
          git push origin HEAD:v31.25-classic-contracts-batch40-navigation-active-view-read-boundary
