name: Batch 40 Gate Audit

on:
  push:
    branches:
      - v31.25-classic-contracts-batch40-navigation-active-view-read-boundary

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v31.25-classic-contracts-batch40-navigation-active-view-read-boundary
      - name: Locate obsolete setLastView gate
        shell: bash
        run: |
          set -euo pipefail
          grep -n -C 3 -F 'setLastView(currentView)' verify-classic-global-debt.mjs
