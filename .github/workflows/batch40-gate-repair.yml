name: Batch 40 Gate Repair

on:
  push:
    branches:
      - v31.25-classic-contracts-batch40-navigation-active-view-read-boundary

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v31.25-classic-contracts-batch40-navigation-active-view-read-boundary
          fetch-depth: 0
      - name: Repair obsolete historical expectation
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('verify-classic-global-debt.mjs'); s=p.read_text(encoding='utf-8'); old='setLastView(currentView)'; new='setLastView(globalThis.TradingResearchCurrentViewReadContract.current())'; assert s.count(old)==2, f'expected 2 obsolete literals, found {s.count(old)}'; p.write_text(s.replace(old,new),encoding='utf-8')"
          rm -f .github/workflows/batch40-gate-audit.yml .github/workflows/batch40-gate-repair.yml
          git diff --check
      - name: Commit repair and remove temporary workflows
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: align historical navigation-state gate with Batch 40 read contract'
          git push origin HEAD:v31.25-classic-contracts-batch40-navigation-active-view-read-boundary
