name: Batch 42 two-read patch

on:
  push:
    branches:
      - v31.25-classic-contracts-batch42-state-current-view-read-boundary

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v31.25-classic-contracts-batch42-state-current-view-read-boundary
      - name: Apply exact State Runtime currentView read replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('state-runtime.js')
          s=p.read_text()
          replacements=[
              ("currentView:typeof currentView!=='undefined'?currentView:''", "currentView:globalThis.TradingResearchCurrentViewReadContract.current()"),
              ("${currentView||'view'} · writes revertidas", "${globalThis.TradingResearchCurrentViewReadContract.current()||'view'} · writes revertidas"),
          ]
          for old,new in replacements:
              count=s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one target for {old!r}, found {count}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- state-runtime.js
      - name: Commit exact patch
        shell: bash
        run: |
          git config user.name "patrickgranell"
          git config user.email "patrickgranelltrading@gmail.com"
          git add state-runtime.js
          git commit -m "refactor(batch42): bind State Runtime currentView reads"
          git push origin HEAD:v31.25-classic-contracts-batch42-state-current-view-read-boundary
