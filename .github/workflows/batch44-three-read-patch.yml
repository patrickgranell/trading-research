name: Batch 44 three-read patch

on:
  push:
    branches:
      - v31.25-classic-contracts-batch44-partial-runtime-current-view-read-boundary

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v31.25-classic-contracts-batch44-partial-runtime-current-view-read-boundary
      - name: Apply exact partial-runtime currentView read replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('structural-runtime.js')
          s=p.read_text()
          replacements=[
              ("if(!view)return;if(currentView==='operations')trPartialPrepareOperations(view);else if(currentView==='market')trPartialPrepareMarket(view);", "if(!view)return;if(globalThis.TradingResearchCurrentViewReadContract.current()==='operations')trPartialPrepareOperations(view);else if(globalThis.TradingResearchCurrentViewReadContract.current()==='market')trPartialPrepareMarket(view);"),
              ("if(currentView==='operations'&&before)trPartialRecord('operations.analytics')", "if(globalThis.TradingResearchCurrentViewReadContract.current()==='operations'&&before)trPartialRecord('operations.analytics')"),
          ]
          for old,new in replacements:
              count=s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one target for {old!r}, found {count}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- structural-runtime.js
      - name: Commit exact patch
        shell: bash
        run: |
          git config user.name "patrickgranell"
          git config user.email "patrickgranelltrading@gmail.com"
          git add structural-runtime.js
          git commit -m "refactor(batch44): bind partial runtime currentView reads"
          git push origin HEAD:v31.25-classic-contracts-batch44-partial-runtime-current-view-read-boundary
