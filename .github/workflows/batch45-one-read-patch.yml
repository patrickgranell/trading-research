name: Batch 45 one-read patch

on:
  push:
    branches:
      - v31.25-classic-contracts-batch45-market-cursor-current-view-read-boundary

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v31.25-classic-contracts-batch45-market-cursor-current-view-read-boundary
      - name: Apply exact market cursor currentView read replacement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('structural-runtime.js')
          s=p.read_text()
          old="const series=v315RunningUi.series;if(!series?.points?.length||currentView!=='market'||v316Ui?.tab!=='running')return trV315SetCursorBase(v);"
          new="const series=v315RunningUi.series;if(!series?.points?.length||globalThis.TradingResearchCurrentViewReadContract.current()!=='market'||v316Ui?.tab!=='running')return trV315SetCursorBase(v);"
          count=s.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one target, found {count}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git diff -- structural-runtime.js
      - name: Commit exact patch
        shell: bash
        run: |
          git config user.name "patrickgranell"
          git config user.email "patrickgranelltrading@gmail.com"
          git add structural-runtime.js
          git commit -m "refactor(batch45): bind market cursor currentView read"
          git push origin HEAD:v31.25-classic-contracts-batch45-market-cursor-current-view-read-boundary
