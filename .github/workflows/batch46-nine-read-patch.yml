name: Batch 46 nine-read patch

on:
  push:
    branches:
      - v31.25-classic-contracts-batch46-central-render-current-view-read-boundary

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v31.25-classic-contracts-batch46-central-render-current-view-read-boundary
      - name: Replace only central render currentView reads
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('structural-runtime.js')
          s=p.read_text()
          start=s.index('render=function(){')
          end=s.index('\n};\nwindow.render=render;',start)+3
          block=s[start:end]
          direct=len(re.findall(r'\bcurrentView\b',block))
          contract=block.count('TradingResearchCurrentViewReadContract.current()')
          if direct != 9 or contract != 0:
              raise SystemExit(f'expected central render direct=9 contract=0, got direct={direct} contract={contract}')
          newblock=re.sub(r'\bcurrentView\b','globalThis.TradingResearchCurrentViewReadContract.current()',block)
          if len(re.findall(r'\bcurrentView\b',newblock)) != 0 or newblock.count('TradingResearchCurrentViewReadContract.current()') != 9:
              raise SystemExit('post-replacement central render counts are not 0 direct / 9 contract')
          p.write_text(s[:start]+newblock+s[end:])
          PY
          git diff --check
          git diff -- structural-runtime.js
      - name: Commit exact patch
        shell: bash
        run: |
          git config user.name "patrickgranell"
          git config user.email "patrickgranelltrading@gmail.com"
          git add structural-runtime.js
          git commit -m "refactor(batch46): bind central render currentView reads"
          git push origin HEAD:v31.25-classic-contracts-batch46-central-render-current-view-read-boundary
