name: Batch48 Session Restore Write Patch
on:
  push:
    branches:
      - v31.25-classic-contracts-batch48-session-restore-current-view-write-boundary
permissions:
  contents: write
jobs:
  patch:
    if: "!startsWith(github.event.head_commit.message, 'fix(batch48):')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v31.25-classic-contracts-batch48-session-restore-current-view-write-boundary
      - name: Apply exact Batch 48 patch
        run: |
          node <<'NODE'
          const fs=require('fs');
          function replaceExact(path,oldText,newText){
            let s=fs.readFileSync(path,'utf8');
            if(!s.includes(oldText))throw new Error(`Missing exact target in ${path}`);
            if(s.split(oldText).length!==2)throw new Error(`Target not unique in ${path}`);
            s=s.replace(oldText,newText);
            fs.writeFileSync(path,s);
          }
          replaceExact(
            'structural-runtime.js',
            "function trUiRestoreViewAtBoot(){\n  const ui=trSessionGet(TR_UI_SESSION_KEY);\n  if(ui?.currentView&&TR_VALID_VIEWS.has(ui.currentView))currentView=ui.currentView;\n}",
            "function trUiRestoreViewAtBoot(){\n  const ui=trSessionGet(TR_UI_SESSION_KEY);\n  if(ui?.currentView&&TR_VALID_VIEWS.has(ui.currentView))globalThis.TradingResearchCurrentViewSessionRestoreWriteContract.restore(ui.currentView);\n}"
          );
          replaceExact(
            'render-source-transform.mjs',
            "const CURRENT_VIEW_NAVIGATION_WRITE_CONTRACT=\"\\n/* V31.25 · Batch 47 · build-only Current View explicit navigation write boundary */\\nObject.defineProperty(globalThis,'TradingResearchCurrentViewNavigationWriteContract',{value:Object.freeze({navigate:view=>{currentView=view;}}),writable:false,enumerable:false,configurable:false});\\n\";",
            "const CURRENT_VIEW_NAVIGATION_WRITE_CONTRACT=\"\\n/* V31.25 · Batch 47 · build-only Current View explicit navigation write boundary */\\nObject.defineProperty(globalThis,'TradingResearchCurrentViewNavigationWriteContract',{value:Object.freeze({navigate:view=>{currentView=view;}}),writable:false,enumerable:false,configurable:false});\\n\";\nconst CURRENT_VIEW_SESSION_RESTORE_WRITE_CONTRACT=\"\\n/* V31.25 · Batch 48 · build-only Current View session restore write boundary */\\nObject.defineProperty(globalThis,'TradingResearchCurrentViewSessionRestoreWriteContract',{value:Object.freeze({restore:view=>{currentView=view;}}),writable:false,enumerable:false,configurable:false});\\n\";"
          );
          replaceExact(
            'render-source-transform.mjs',
            "  if(!out.includes(\"Object.defineProperty(globalThis,'TradingResearchCurrentViewNavigationWriteContract'\"))out+=CURRENT_VIEW_NAVIGATION_WRITE_CONTRACT;\n  return {source:out,removed:ranges.length,renderAliasesRemoved:aliases.removed};",
            "  if(!out.includes(\"Object.defineProperty(globalThis,'TradingResearchCurrentViewNavigationWriteContract'\"))out+=CURRENT_VIEW_NAVIGATION_WRITE_CONTRACT;\n  if(!out.includes(\"Object.defineProperty(globalThis,'TradingResearchCurrentViewSessionRestoreWriteContract'\"))out+=CURRENT_VIEW_SESSION_RESTORE_WRITE_CONTRACT;\n  return {source:out,removed:ranges.length,renderAliasesRemoved:aliases.removed};"
          );
          replaceExact(
            'verify-current-view-navigation-write-boundary.mjs',
            "need(structural.includes(\"if(ui?.currentView&&TR_VALID_VIEWS.has(ui.currentView))currentView=ui.currentView;\"),'Cambió boot restore currentView fuera de alcance.');",
            "need(structural.includes(\"if(ui?.currentView&&TR_VALID_VIEWS.has(ui.currentView))globalThis.TradingResearchCurrentViewSessionRestoreWriteContract.restore(ui.currentView);\"),'Cambió boot restore/session write boundary fuera de alcance.');"
          );
          NODE
      - name: Commit patch
        run: |
          git config user.name patrickgranell
          git config user.email patrickgranelltrading@gmail.com
          git add structural-runtime.js render-source-transform.mjs verify-current-view-navigation-write-boundary.mjs
          git commit -m "fix(batch48): bind boot session currentView restore write"
          git push
