name: Batch49 Router Fallback Patch

on:
  push:
    branches:
      - v31.25-classic-contracts-batch49-router-fallback-current-view-write-boundary

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v31.25-classic-contracts-batch49-router-fallback-current-view-write-boundary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply exact Batch 49 patch
        run: |
          node <<'NODE'
          const fs=require('fs');

          const transformPath='render-source-transform.mjs';
          let transform=fs.readFileSync(transformPath,'utf8');
          const contractAnchor=`const CURRENT_VIEW_SESSION_RESTORE_WRITE_CONTRACT="\\n/* V31.25 · Batch 48 · build-only Current View session restore write boundary */\\nObject.defineProperty(globalThis,'TradingResearchCurrentViewSessionRestoreWriteContract',{value:Object.freeze({restore:view=>{currentView=view;}}),writable:false,enumerable:false,configurable:false});\\n";`;
          const contractLine=`const CURRENT_VIEW_ROUTER_FALLBACK_WRITE_CONTRACT="\\n/* V31.25 · Batch 49 · build-only Current View router fallback write boundary */\\nObject.defineProperty(globalThis,'TradingResearchCurrentViewRouterFallbackWriteContract',{value:Object.freeze({toDashboard:()=>{currentView='dashboard';}}),writable:false,enumerable:false,configurable:false});\\n";`;
          if(!transform.includes(contractLine)){
            if(!transform.includes(contractAnchor))throw new Error('Batch49 contract anchor not found');
            transform=transform.replace(contractAnchor,contractAnchor+'\n'+contractLine);
          }
          const publishAnchor=`  if(!out.includes("Object.defineProperty(globalThis,'TradingResearchCurrentViewSessionRestoreWriteContract'"))out+=CURRENT_VIEW_SESSION_RESTORE_WRITE_CONTRACT;`;
          const publishLine=`  if(!out.includes("Object.defineProperty(globalThis,'TradingResearchCurrentViewRouterFallbackWriteContract'"))out+=CURRENT_VIEW_ROUTER_FALLBACK_WRITE_CONTRACT;`;
          if(!transform.includes(publishLine)){
            if(!transform.includes(publishAnchor))throw new Error('Batch49 publish anchor not found');
            transform=transform.replace(publishAnchor,publishAnchor+'\n'+publishLine);
          }
          fs.writeFileSync(transformPath,transform);

          const structuralPath='structural-runtime.js';
          let structural=fs.readFileSync(structuralPath,'utf8');
          const oldLine="      currentView='dashboard';";
          const newLine='      globalThis.TradingResearchCurrentViewRouterFallbackWriteContract.toDashboard();';
          if(!structural.includes(newLine)){
            const count=structural.split(oldLine).length-1;
            if(count!==1)throw new Error(`Batch49 expected exactly 1 router fallback write, found ${count}`);
            structural=structural.replace(oldLine,newLine);
          }
          fs.writeFileSync(structuralPath,structural);
          NODE
      - name: Commit exact patch if needed
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "patrickgranell"
          git config user.email "patrickgranelltrading@gmail.com"
          git add render-source-transform.mjs structural-runtime.js
          git commit -m "fix(batch49): apply router fallback currentView write boundary"
          git push origin HEAD:v31.25-classic-contracts-batch49-router-fallback-current-view-write-boundary
