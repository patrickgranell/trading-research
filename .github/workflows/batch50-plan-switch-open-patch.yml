name: Batch 50 plan-switch-open patch

on:
  push:
    branches:
      - v31.25-classic-contracts-batch50-plan-switch-open-current-view-write-boundary

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v31.25-classic-contracts-batch50-plan-switch-open-current-view-write-boundary
      - name: Apply exact plan-switch-open replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('render-source-transform.mjs')
          s=p.read_text()
          old="const CURRENT_VIEW_ROUTER_FALLBACK_WRITE_CONTRACT=\"\\n/* V31.25 · Batch 49 · build-only Current View router fallback write boundary */\\nObject.defineProperty(globalThis,'TradingResearchCurrentViewRouterFallbackWriteContract',{value:Object.freeze({toDashboard:()=>{currentView='dashboard';}}),writable:false,enumerable:false,configurable:false});\\n\";"
          new=old+"\nconst CURRENT_VIEW_PLAN_SWITCH_OPEN_WRITE_CONTRACT=\"\\n/* V31.25 · Batch 50 · build-only Current View plan-switch-open write boundary */\\nObject.defineProperty(globalThis,'TradingResearchCurrentViewPlanSwitchOpenWriteContract',{value:Object.freeze({toDashboard:()=>{currentView='dashboard';}}),writable:false,enumerable:false,configurable:false});\\n\";"
          count=s.count(old)
          if count != 1:
              raise SystemExit(f'expected one contract anchor, found {count}')
          s=s.replace(old,new,1)
          old_pub="  if(!out.includes(\"Object.defineProperty(globalThis,'TradingResearchCurrentViewRouterFallbackWriteContract'\"))out+=CURRENT_VIEW_ROUTER_FALLBACK_WRITE_CONTRACT;"
          new_pub=old_pub+"\n  if(!out.includes(\"Object.defineProperty(globalThis,'TradingResearchCurrentViewPlanSwitchOpenWriteContract'\"))out+=CURRENT_VIEW_PLAN_SWITCH_OPEN_WRITE_CONTRACT;"
          count=s.count(old_pub)
          if count != 1:
              raise SystemExit(f'expected one publication anchor, found {count}')
          s=s.replace(old_pub,new_pub,1)
          p.write_text(s)

          p=Path('state-runtime.js')
          s=p.read_text()
          old="if(typeof v30EnsureBaselineLocal==='function')v30EnsureBaselineLocal();currentView='dashboard';"
          new="if(typeof v30EnsureBaselineLocal==='function')v30EnsureBaselineLocal();globalThis.TradingResearchCurrentViewPlanSwitchOpenWriteContract.toDashboard();"
          count=s.count(old)
          if count != 1:
              raise SystemExit(f'expected one switchPlanAndOpen target, found {count}')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- render-source-transform.mjs state-runtime.js
      - name: Commit exact patch
        shell: bash
        run: |
          git config user.name "patrickgranell"
          git config user.email "patrickgranelltrading@gmail.com"
          git add render-source-transform.mjs state-runtime.js
          git commit -m "refactor(batch50): bind plan-switch-open currentView write contract"
          git push origin HEAD:v31.25-classic-contracts-batch50-plan-switch-open-current-view-write-boundary
