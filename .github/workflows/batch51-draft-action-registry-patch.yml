name: Batch 51 Draft Action Registry Patch

on:
  push:
    branches:
      - v31.25-batch51-operation-draft-hydration-restore
    paths:
      - .github/workflows/batch51-draft-action-registry-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v31.25-batch51-operation-draft-hydration-restore
      - name: Republish draft wrappers into action registry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('structural-runtime.js')
          s=p.read_text()
          pairs=[
            ("window.openOperationModal=openOperationModal;", "window.openOperationModal=openOperationModal;\nif(globalThis.TradingResearchActions&&typeof globalThis.TradingResearchActions==='object')globalThis.TradingResearchActions.openOperationModal=openOperationModal;"),
            ("window.closeModal=closeModal;", "window.closeModal=closeModal;\nif(globalThis.TradingResearchActions&&typeof globalThis.TradingResearchActions==='object')globalThis.TradingResearchActions.closeModal=closeModal;"),
            ("window.saveOperationFromForm=saveOperationFromForm;", "window.saveOperationFromForm=saveOperationFromForm;\nif(globalThis.TradingResearchActions&&typeof globalThis.TradingResearchActions==='object')globalThis.TradingResearchActions.saveOperationFromForm=saveOperationFromForm;")
          ]
          for old,new in pairs:
            if s.count(old) != 1:
              raise SystemExit(f'expected exactly one anchor {old!r}, found {s.count(old)}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add structural-runtime.js
          git diff --cached --check
          git commit -m "fix(batch51): keep draft wrappers effective in action registry"
          git push origin HEAD:v31.25-batch51-operation-draft-hydration-restore
