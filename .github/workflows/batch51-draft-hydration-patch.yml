name: Batch 51 Draft Hydration Patch

on:
  push:
    branches:
      - v31.25-batch51-operation-draft-hydration-restore
    paths:
      - .github/workflows/batch51-draft-hydration-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v31.25-batch51-operation-draft-hydration-restore
      - name: Apply exact hydration guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('structural-runtime.js')
          s=p.read_text()
          old="function trDraftMaybeRestoreAfterView(){\n  if(trDraftRestoreAttempted)return;"
          new="function trDraftMaybeRestoreAfterView(){\n  if(typeof trCoreHydrated!=='undefined'&&!trCoreHydrated)return;\n  if(trDraftRestoreAttempted)return;"
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one draft restore anchor, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add structural-runtime.js
          git diff --cached --check
          git commit -m "fix(batch51): wait for hydration before draft restore"
          git push origin HEAD:v31.25-batch51-operation-draft-hydration-restore
