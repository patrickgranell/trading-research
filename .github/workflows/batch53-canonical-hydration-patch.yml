name: Batch 53 Canonical Hydration Patch

on:
  push:
    branches:
      - v31.25-batch53-core-hydration-read-boundary
    paths:
      - .github/workflows/batch53-canonical-hydration-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v31.25-batch53-core-hydration-read-boundary
      - name: Bind Canonical Metrics hydration reads
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('canonical-metrics-runtime.js');s=p.read_text()
          repls=[
            ("if(typeof trCoreHydrated!=='undefined'&&!trCoreHydrated)return 0;","if(!globalThis.TradingResearchCoreHydrationReadContract.ready())return 0;"),
            ("if(typeof trCoreHydrated!=='undefined'&&trCoreHydrated){","if(globalThis.TradingResearchCoreHydrationReadContract.ready()){"),
          ]
          for old,new in repls:
            count=s.count(old)
            if count!=1: raise SystemExit(f'canonical-metrics-runtime.js: expected exactly 1 anchor {old!r}, found {count}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical-metrics-runtime.js
          git diff --cached --check
          git commit -m "fix(batch53): bind canonical hydration reads"
          git push origin HEAD:v31.25-batch53-core-hydration-read-boundary
