name: Batch 53 Verifier Composition

on:
  push:
    branches:
      - v31.25-batch53-core-hydration-read-boundary
    paths:
      - .github/workflows/batch53-verifier-composition.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v31.25-batch53-core-hydration-read-boundary
      - name: Compose Canonical Metrics and Batch 53 gates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('verify-canonical-metrics.mjs');s=p.read_text()
          old="vm.createContext(ctx);\nvm.runInContext(["
          new="vm.createContext(ctx);\nctx.TradingResearchCoreHydrationReadContract=Object.freeze({ready:()=>!!ctx.trCoreHydrated});\nvm.runInContext(["
          if s.count(old)!=1: raise SystemExit(f'verify-canonical-metrics.mjs: context anchor count {s.count(old)}')
          p.write_text(s.replace(old,new,1))

          p=Path('verify-core-hydration-read-boundary.mjs');s=p.read_text()
          repls=[
            ("const stateEffective=transformStateActions(stateSource).source;\nconst bundled=consolidateLegacyRenderAssignments(app,{expected:12}).source;",
             "const stateEffective=transformStateActions(stateSource).source;\nconst canonical=fs.readFileSync('canonical-metrics-runtime.js','utf8');\nconst bundled=consolidateLegacyRenderAssignments(app,{expected:12}).source;"),
            ("need(directRefs(stateEffective)===0,`State Runtime efectivo conserva ${directRefs(stateEffective)} referencia(s) directa(s) a trCoreHydrated.`);\nneed(contractCalls(structural)===2,",
             "need(directRefs(stateEffective)===0,`State Runtime efectivo conserva ${directRefs(stateEffective)} referencia(s) directa(s) a trCoreHydrated.`);\nneed(directRefs(canonical)===0,`Canonical Metrics conserva ${directRefs(canonical)} referencia(s) directa(s) a trCoreHydrated.`);\nneed(contractCalls(structural)===2,"),
            ("need(contractCalls(stateEffective)===2,`State Runtime efectivo debe usar exactamente 2 lecturas de ${CONTRACT}; encontró ${contractCalls(stateEffective)}.`);",
             "need(contractCalls(stateEffective)===2,`State Runtime efectivo debe usar exactamente 2 lecturas de ${CONTRACT}; encontró ${contractCalls(stateEffective)}.`);\nneed(contractCalls(canonical)===2,`Canonical Metrics debe usar exactamente 2 lecturas de ${CONTRACT}; encontró ${contractCalls(canonical)}.`);"),
            ("need(stateEffective.includes(`if(globalThis.${CONTRACT}.ready())trStateEnsureAttached('runtime-load');trUiCapture('runtime-load');`),\n  'State Runtime no conserva el attach inmediato post-hidratación mediante contrato.');",
             "need(stateEffective.includes(`if(globalThis.${CONTRACT}.ready())trStateEnsureAttached('runtime-load');trUiCapture('runtime-load');`),\n  'State Runtime no conserva el attach inmediato post-hidratación mediante contrato.');\nneed(canonical.includes(`if(!globalThis.${CONTRACT}.ready())return 0;`),\n  'Canonical Metrics no conserva el guard de normalización post-hidratación mediante contrato.');\nneed(canonical.includes(`if(globalThis.${CONTRACT}.ready()){`),\n  'Canonical Metrics no conserva la decisión de bootstrap hidratado mediante contrato.');\nneed(canonical.includes(\"addEventListener('tradingresearch:core-hydrated',()=>trCanonicalNormalizeAfterHydration(),{once:true});\"),\n  'Canonical Metrics cambió el listener de hidratación durable fuera de alcance.');"),
            ("console.log(' - direct trCoreHydrated runtime reads: 4 -> 0');\nconsole.log(' - Structural Runtime: 2 hydration reads contract-bound');\nconsole.log(' - State Runtime: 2 hydration reads contract-bound');",
             "console.log(' - direct trCoreHydrated semantic runtime reads: 6 -> 0');\nconsole.log(' - Structural Runtime: 2 hydration reads contract-bound');\nconsole.log(' - State Runtime: 2 hydration reads contract-bound');\nconsole.log(' - Canonical Metrics: 2 hydration reads contract-bound');"),
          ]
          for old,new in repls:
            count=s.count(old)
            if count!=1: raise SystemExit(f'verify-core-hydration-read-boundary.mjs: expected 1 anchor, found {count}: {old[:90]!r}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit verifier composition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verify-canonical-metrics.mjs verify-core-hydration-read-boundary.mjs
          git diff --cached --check
          git commit -m "test(batch53): compose canonical hydration coverage"
          git push origin HEAD:v31.25-batch53-core-hydration-read-boundary
