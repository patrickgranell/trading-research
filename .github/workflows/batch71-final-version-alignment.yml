name: Batch 71 Final Version Alignment

on:
  push:
    branches:
      - v31.26-batch71-release-version-alignment

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v31.26-batch71-release-version-alignment
          fetch-depth: 0

      - name: Align remaining global release references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'render-closure-runtime.js': [
                  ('Release global V31.25.0. Los diagnósticos internos conservan sus versiones históricas por componente.',
                   'Release global V31.26.0. Los diagnósticos internos conservan sus versiones históricas por componente.'),
              ],
              'verify-backup-v2.mjs': [
                  ("need(pkg.version==='31.25.0',`Versión inesperada ${pkg.version}`);",
                   "need(pkg.version==='31.26.0',`Versión inesperada ${pkg.version}`);"),
              ],
              'verify-blob-lifecycle.mjs': [
                  ("need(pkg.version==='31.25.0',`Versión inesperada ${pkg.version}`);",
                   "need(pkg.version==='31.26.0',`Versión inesperada ${pkg.version}`);"),
              ],
              'verify-csp.mjs': [
                  ("need(pkg.version==='31.25.0',`Versión inesperada ${pkg.version}`);",
                   "need(pkg.version==='31.26.0',`Versión inesperada ${pkg.version}`);"),
                  ('trading-research-source-version" content="31.25.0"',
                   'trading-research-source-version" content="31.26.0"'),
                  ('source-version no es 31.25.0.', 'source-version no es 31.26.0.'),
              ],
              'verify-persistence-coalescing.mjs': [
                  ("need(pkg.version==='31.25.0',`Versión inesperada ${pkg.version}`);",
                   "need(pkg.version==='31.26.0',`Versión inesperada ${pkg.version}`);"),
              ],
              'verify-source-consolidation-final.mjs': [
                  ("need(pkg.version==='31.25.0',`package.json no está en la versión final 31.25.0: ${pkg.version}`);",
                   "need(pkg.version==='31.26.0',`package.json no está en la versión final 31.26.0: ${pkg.version}`);"),
                  ("packageVersion:'31.25.0'", "packageVersion:'31.26.0'"),
                  ("Package release version: 31.25.0", "Package release version: 31.26.0"),
              ],
              'verify-structure.mjs': [
                  ("if(pkg.version!=='31.25.0')fail.push(`Versión inesperada: ${pkg.version}`);",
                   "if(pkg.version!=='31.26.0')fail.push(`Versión inesperada: ${pkg.version}`);"),
              ],
              'verify-style-build.mjs': [
                  ("need(pkg.version==='31.25.0',`Versión inesperada ${pkg.version}`);",
                   "need(pkg.version==='31.26.0',`Versión inesperada ${pkg.version}`);"),
              ],
              'verify-styles.mjs': [
                  ("need(pkg.version==='31.25.0',`Versión inesperada ${pkg.version}`);",
                   "need(pkg.version==='31.26.0',`Versión inesperada ${pkg.version}`);"),
              ],
              'README.md': [
                  ('**Producción / `main`**: V31.25.0.', '**Producción / `main`**: V31.26.0.'),
                  ('**PR de trabajo**: V31.25 · Reaudit Hardening.', '**PR de trabajo**: V31.26 · Release Version Alignment.'),
                  ('V31.25.0 fue promovida tras CI exact-head, Cloudflare exact-head, smoke interactivo y cierre del gate remoto Supabase V10; `main` y producción ya corresponden a V31.25.0.',
                   'V31.26.0 consolida Taxonomy + Branding y alinea la versión global visible con el estado real de la aplicación; los diagnósticos internos conservan sus versiones históricas por componente.'),
              ],
          }

          for file, pairs in replacements.items():
              p = Path(file)
              text = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Missing expected text in {file}: {old}')
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')

          # The style-attr runtime is an internal component version and must remain frozen.
          style_verify = Path('verify-style-build.mjs').read_text(encoding='utf-8')
          if 'data-tr-style-attr-runtime="31.25.0"' not in style_verify:
              raise SystemExit('Internal style-attr runtime version was unexpectedly changed')
          PY

          node verify-release-version.mjs
          rm .github/workflows/batch71-final-version-alignment.yml

      - name: Commit final release alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md render-closure-runtime.js verify-backup-v2.mjs verify-blob-lifecycle.mjs verify-csp.mjs verify-persistence-coalescing.mjs verify-source-consolidation-final.mjs verify-structure.mjs verify-style-build.mjs verify-styles.mjs .github/workflows/batch71-final-version-alignment.yml
          git commit -m 'Align all global release references to V31.26.0'
          git push origin HEAD:v31.26-batch71-release-version-alignment
