name: Batch 71 Release Version Alignment

on:
  push:
    branches:
      - v31.26-batch71-release-version-alignment

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v31.26-batch71-release-version-alignment
          fetch-depth: 0

      - name: Align release metadata to V31.26.0
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'package.json': [
                  ('"version": "31.25.0"', '"version": "31.26.0"'),
              ],
              'index.html': [
                  ('name="trading-research-source-version" content="31.25.0"', 'name="trading-research-source-version" content="31.26.0"'),
              ],
              'render-closure-runtime.js': [
                  ("const TR_RELEASE_VERSION='31.25.0';", "const TR_RELEASE_VERSION='31.26.0';"),
                  ("const TR_RELEASE_LABEL='V31.25 · Reaudit Hardening';", "const TR_RELEASE_LABEL='V31.26 · Taxonomy + Branding';"),
              ],
              'verify-release-version.mjs': [
                  ("const EXPECTED='31.25.0';", "const EXPECTED='31.26.0';"),
                  ('V31.25.0', 'V31.26.0'),
                  ("V31.25 · Reaudit Hardening", "V31.26 · Taxonomy + Branding"),
              ],
          }

          for file, pairs in replacements.items():
              p = Path(file)
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Missing expected text in {file}: {old}')
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'No change produced for {file}')
              p.write_text(text, encoding='utf-8')
          PY

          node verify-release-version.mjs
          rm .github/workflows/batch71-release-version-alignment.yml

      - name: Commit aligned release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json index.html render-closure-runtime.js verify-release-version.mjs .github/workflows/batch71-release-version-alignment.yml
          git commit -m 'Align visible release version to V31.26.0'
          git push origin HEAD:v31.26-batch71-release-version-alignment
