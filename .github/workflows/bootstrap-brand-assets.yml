name: Bootstrap exact brand assets

on:
  push:
    branches:
      - v31.26-batch70-theme-brand-logos

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v31.26-batch70-theme-brand-logos
          fetch-depth: 0

      - name: Resolve firestorage exact-file download endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://firestorage.ai/ja/f/IBnLmVbuGKZ2' \
            --output /tmp/firestorage-share.html
          echo '--- candidate download references ---'
          grep -Eo 'https?://[^"'"'"' <>]+|href="[^"]+"|src="[^"]+"' /tmp/firestorage-share.html \
            | grep -Ei 'download|file|asset|api|brand-logo|IBnLmVbuGKZ2' \
            | head -n 120 || true
          echo '--- file-name references ---'
          grep -Ein 'brand-logo|01a0848039be75298124e0db3c7ee3aa|01a08480714572e5938dd67033881d9b' /tmp/firestorage-share.html \
            | head -n 80 || true
