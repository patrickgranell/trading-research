name: Bootstrap exact brand assets

on:
  push:
    branches:
      - v31.26-batch70-theme-brand-logos

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v31.26-batch70-theme-brand-logos
          fetch-depth: 0

      - name: Resolve exact firestorage files
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.firestorage.ai/prod/file/shares/IBnLmVbuGKZ2'
          curl --fail --location --retry 3 "$api/files?maxResults=1000" --output /tmp/files.json
          python - <<'PY'
          import json
          with open('/tmp/files.json','r',encoding='utf-8') as f:
              data=json.load(f)
          print(json.dumps(data, indent=2, ensure_ascii=False))
          PY
