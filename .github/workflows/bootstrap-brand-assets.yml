name: Bootstrap exact brand assets

on:
  push:
    branches:
      - v31.26-batch70-theme-brand-logos

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v31.26-batch70-theme-brand-logos
          fetch-depth: 0

      - name: Resolve firestorage exact-file API
        shell: bash
        run: |
          set -euo pipefail
          base='https://firestorage.ai'
          share='https://firestorage.ai/ja/f/IBnLmVbuGKZ2'
          curl --fail --location --retry 3 "$share" --output /tmp/share.html
          js_path="$(grep -Eo 'src="[^"]*app/\(files\)/ja/f/page-[^"]+\.js"' /tmp/share.html | head -n1 | cut -d'"' -f2)"
          test -n "$js_path"
          echo "JS=$js_path"
          curl --fail --location --retry 3 "$base$js_path" --output /tmp/share-page.js
          echo '--- API/path candidates ---'
          grep -Eo 'https?://[^"'"'"' <>]+|/[A-Za-z0-9_?&=./:{}$-]{4,}' /tmp/share-page.js \
            | grep -Ei 'api|download|file|folder|share|public|storage|presign|signed' \
            | sort -u \
            | head -n 240 || true
          echo '--- nearby semantic strings ---'
          grep -Eo '.{0,120}(download|file_id|public_id|share_url|signed|presign).{0,180}' /tmp/share-page.js \
            | head -n 160 || true
