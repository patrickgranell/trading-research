name: Bootstrap exact brand assets

on:
  push:
    branches:
      - v31.26-batch70-theme-brand-logos

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v31.26-batch70-theme-brand-logos
          fetch-depth: 0

      - name: Download and verify exact source PNGs
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.firestorage.ai/prod/file/shares/IBnLmVbuGKZ2'

          get_download_url() {
            local file_id="$1"
            local response="$2"
            local status
            status="$(curl -sS --location -o "$response" -w '%{http_code}' \
              -X POST "$api/files/$file_id/download")"

            if [[ "$status" != 2* ]]; then
              echo "Direct download authorization returned HTTP $status; creating cushion session."
              local cushion_status
              cushion_status="$(curl -sS --location -c /tmp/firestorage.cookies -b /tmp/firestorage.cookies \
                -o /tmp/cushion.json -w '%{http_code}' \
                -X POST -H 'Content-Type: application/json' \
                --data '{"password":null}' \
                "$api/cushion-sessions")"
              test "$cushion_status" = '200'
              status="$(curl -sS --location -c /tmp/firestorage.cookies -b /tmp/firestorage.cookies \
                -o "$response" -w '%{http_code}' \
                -X POST "$api/files/$file_id/download")"
            fi

            test "$status" = '200'
            python - "$response" <<'PY'
          import json, sys
          with open(sys.argv[1], 'r', encoding='utf-8') as f:
              payload = json.load(f)
          url = payload.get('downloadUrl')
          if not isinstance(url, str) or not url.startswith('https://'):
              raise SystemExit('Missing valid downloadUrl')
          print(url)
          PY
          }

          light_url="$(get_download_url '01a0848039be75298124e0db3c7ee3aa' /tmp/light-download.json)"
          dark_url="$(get_download_url '01a08480714572e5938dd67033881d9b' /tmp/dark-download.json)"

          curl --fail --location --retry 3 "$light_url" --output brand-logo-light.png.tmp
          curl --fail --location --retry 3 "$dark_url" --output brand-logo-dark.png.tmp

          test "$(wc -c < brand-logo-light.png.tmp | tr -d ' ')" = '184522'
          test "$(sha256sum brand-logo-light.png.tmp | awk '{print $1}')" = 'c1d9f082e1e6ca2735fda2bcffbe0fe7fd4df34bb028de6ae7866f42a5c3e531'
          test "$(wc -c < brand-logo-dark.png.tmp | tr -d ' ')" = '195047'
          test "$(sha256sum brand-logo-dark.png.tmp | awk '{print $1}')" = '391db80af4509cce4e29c5211634d26a53253f2033863edcee2f88505d276199'

          mv brand-logo-light.png.tmp brand-logo-light.png
          mv brand-logo-dark.png.tmp brand-logo-dark.png

          echo 'Exact source binaries verified:'
          sha256sum brand-logo-light.png brand-logo-dark.png
          wc -c brand-logo-light.png brand-logo-dark.png

      - name: Commit exact binary assets if needed
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch brand-logo-light.png >/dev/null 2>&1 && \
             git ls-files --error-unmatch brand-logo-dark.png >/dev/null 2>&1 && \
             git diff --quiet -- brand-logo-light.png brand-logo-dark.png; then
            echo 'Exact assets already committed; nothing to do.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brand-logo-light.png brand-logo-dark.png
          git commit -m 'Add exact theme brand logo binaries'
          git push origin HEAD:v31.26-batch70-theme-brand-logos
