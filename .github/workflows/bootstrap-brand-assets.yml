name: Bootstrap exact brand assets

on:
  push:
    branches:
      - v31.26-batch70-theme-brand-logos

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v31.26-batch70-theme-brand-logos
          fetch-depth: 0

      - name: Inspect firestorage cushion/download contract
        shell: bash
        run: |
          set -euo pipefail
          chunk='https://firestorage.ai/_next/static/chunks/4899-d89df949f2dbd5af.js'
          curl --fail --location --retry 3 "$chunk" --output /tmp/app.js
          python - <<'PY'
          text=open('/tmp/app.js','r',encoding='utf-8').read()
          for needle in ['cushion-sessions','async function eD','function eD','requiresCushion','/download']:
              print('\n===', needle, '===')
              start=0
              seen=0
              while True:
                  i=text.find(needle,start)
                  if i<0 or seen>=8: break
                  print(text[max(0,i-900):min(len(text),i+1800)])
                  start=i+len(needle)
                  seen+=1
          PY
