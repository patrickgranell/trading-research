name: Validate Trading Research

on:
  push:
    branches:
      - main
      - v31.23-source-consolidation
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prebuild verification
        run: npm run prebuild

      - name: Cloud V10 revision timestamp gate
        run: node verify-cloud-v10-revision-timestamp-equality.mjs

      - name: Configurable taxonomy domain gate
        run: node verify-taxonomy-domain-v31-26.mjs

      - name: Taxonomy active/historical separation gate
        run: node verify-taxonomy-active-historical-separation.mjs

      - name: Favicon brand icon gate
        run: node verify-favicon-brand-icon.mjs

      - name: Theme brand logos gate
        run: node verify-theme-brand-logos.mjs

      - name: Build verification
        run: npm run build

      - name: TR-UX-026 light/dark Chromium visual smoke
        run: node verify-tr-ux-026-browser.mjs

      - name: Astra Lote 2 · UI scenarios in Chromium
        run: node verify-astra-lote2-browser.mjs

      - name: Astra Lote 3 · UI navigation scenarios in Chromium
        run: node verify-astra-lote3-browser.mjs
